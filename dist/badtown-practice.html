/* BADTOWN practice yard.
   Layout: one narrow column like a clipboard; a sticky status strip (day, tunnel, your number);
   the screen itself is the prison lighting: fluorescent paper by day, coal at night. */
:root {
  --paper: #e9e4d4;       /* aged institutional off-white */
  --paper-2: #ddd7c4;
  --coal: #151715;        /* lights out */
  --slab: #232622;
  --concrete: #8a8c84;
  --ink: #161714;
  --olive: #5c6346;
  --warning: #ef6a1d;     /* tunnel, alerts */
  --alarm: #c3302a;       /* caught, lockdown */
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --stencil: "Big Shoulders Stencil Display", "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --bg: var(--paper);
  --fg: var(--ink);
  --muted: #5d5f57;
  --line: rgba(22, 23, 20, 0.22);
  --raise: var(--paper-2);
  color-scheme: light;
}
body[data-lights="off"] {
  --bg: var(--coal);
  --fg: #d9d4c3;
  --muted: #8f9186;
  --line: rgba(217, 212, 195, 0.18);
  --raise: var(--slab);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  color: var(--fg);
  font: 400 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

}

:focus-visible { outline: 3px solid var(--warning); outline-offset: 2px; }

.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 3px solid var(--fg); display: grid; gap: 8px; transition: background-color 0.45s ease; }

/* The tunnel: cells on the left, the wall on the right, one block per metre */

/* Panels and buttons */
.sheet { border: 2px solid var(--fg); padding: 16px; display: grid; gap: 12px; background: var(--raise); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--fg); }
.seg button { min-height: 48px; border: 0; background: transparent; font-family: var(--display); font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; }

.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
input[type="text"] { min-height: 52px; padding: 0 14px; border: 2px solid var(--fg); background: transparent; width: 100%; font-size: 18px; }

/* Yard talk */
.yard { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.yard li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: baseline; }
.yard b { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; font-size: 15px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Stamps: verdicts land like ink on a form */
.stamp { justify-self: start; font-family: var(--stencil); font-weight: 900; text-transform: uppercase; font-size: clamp(40px, 12vw, 64px); line-height: 0.9; padding: 8px 14px 4px; border: 5px solid currentColor; color: var(--alarm); transform: rotate(-4deg); letter-spacing: 0.02em; }
.stamp.go { color: var(--warning); }
.stamp.olive { color: var(--olive); }
body[data-lights="off"] .stamp.olive { color: #9aa37a; }
.stamp.land { animation: stamp 0.35s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: rotate(-4deg) scale(1.8); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }

.note { border-left: 6px solid var(--warning); padding: 10px 14px; background: var(--raise); }
.note.alarm { border-color: var(--alarm); }
hr { border: 0; border-top: 3px solid var(--fg); margin: 6px 0; }

/* Reveal tables */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; white-space: nowrap; }
th { font-family: var(--display); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 13px; }
td.dig { color: var(--warning); font-weight: 700; }
td.hole, td.caught { color: var(--alarm); font-weight: 700; }

.hero { padding-block: 28px 8px; display: grid; gap: 14px; }
.hero .title { font-family: var(--stencil); font-weight: 900; font-size: clamp(76px, 25vw, 150px); line-height: 0.8; letter-spacing: -0.01em; text-transform: uppercase; }
.hero .sub { font-size: 19px; max-width: 32ch; }
details.rules summary { cursor: pointer; font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; list-style: none; }
details.rules summary::-webkit-details-marker { display: none; }
details.rules ol { margin: 10px 0 0; padding-left: 22px; display: grid; gap: 8px; }
main { padding-top: 18px; display: grid; gap: 20px; }

<script>
const BT = (() => {
// ---- src/badtown/rng.ts
// Deterministic, seedable random numbers. The seed comes from crypto.getRandomValues at
// game start and the running state is persisted with the room, so every shuffle, target
// pick and tie-break is reproducible from the room log and never chosen by the host.

                            
              
 

/** mulberry32: returns a float in [0, 1) and advances the stored state. */
function next(h           )         {
  h.rng = (h.rng + 0x6d2b79f5) | 0;
  let t = h.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function int(h           , maxExclusive        )         {
  return Math.floor(next(h) * maxExclusive);
}

function pick   (h           , items              )    {
  if (items.length === 0) throw new Error("pick from empty list");
  return items[int(h, items.length)];
}

/** Fisher-Yates shuffle into a new array. */
function shuffle   (h           , items              )      {
  const out = items.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = int(h, i + 1);
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

/** A random permutation where nobody maps to themselves (requires length >= 2). */
function derangement(h           , ids                   )                      {
  if (ids.length < 2) throw new Error("derangement needs at least 2 items");
  // Shuffle, then map each person to the next in the shuffled ring: a random single
  // cycle, which is always a derangement.
  const order = shuffle(h, ids);
  const map = new Map                ();
  for (let i = 0; i < order.length; i++) map.set(order[i], order[(i + 1) % order.length]);
  return map;
}

function randomSeed()         {
  const buf = new Uint32Array(1);
  crypto.getRandomValues(buf);
  return buf[0] | 0;
}

// ---- src/badtown/config.ts
// BADTOWN tuning. Every number lives here. Wall distances balanced on the real engine with
// best-response play (scripts/calibrate.ts): 39-56% escapes at every table size.

                             
                 
                  
               
                                           
               
 

const TABLES                             = {
  4: { guards: 1, inmates: 3, rats: 1, wall: 3 },
  5: { guards: 1, inmates: 4, rats: 1, wall: 7 },
  6: { guards: 2, inmates: 4, rats: 1, wall: 3 },
  7: { guards: 2, inmates: 5, rats: 1, wall: 6 },
  8: { guards: 2, inmates: 6, rats: 2, wall: 7 },
};

                         
                     
                     
                 
                                                                                    
                   
                                                  
                      
                           
           
                 
                
                  
                  
                      
                    
                       
                         
    
                        
                      
 

const CONFIG         = {
  minPlayers: 4,
  maxPlayers: 8,
  nights: 6,
  countDay: 3,
  trustyAfter: 3,
  timers: { role: 25, day: 60, count: 30, cells: 20, guardroom: 25, morning: 15, trustyPick: 30, trustyChoice: 20 },
  chatMaxLength: 200,
  chatHistory: 80,
};

// ---- src/badtown/engine.ts
// BADTOWN rules engine. Pure and deterministic: no I/O, no clocks, no globals.
// The same engine runs the multiplayer room server and the in-browser practice mode.



// ---------------------------------------------------------------------------------------
// Types

                                         
                                                  
                                        
                   
                                                                                           
                                            

                                                                                                
                                                                                                       

                         
             
               
                    
               
                  
                 
                 
                     
                          
                                                          
                        
               
                    
                                
                                                               
                           
                   
 

                              
                
                                 
                                   
                   
                    
                   
                                                               
               
                      
                    
 

                            
              
                                       
                        
                         
                
 

                             
                                
                        
                    
                                
 

                          
               
                                
                
 

                           
              
               
               
             
 

                            
                 
               
                    
                 
               
                          
                                                                          
                   
              
                 
                           
                 
               
              
                    
                        
                          
                            
                          
                      
                   
              
                                 
 

                     
                                     
                     
                     
                          
                                  
                                    
                                                 
                                           
                                                   
                                  
                        

                                                                                      

const OK         = { ok: true };
const fail = (error        )         => ({ ok: false, error });

// ---------------------------------------------------------------------------------------
// Construction

function newRoom(code        , now        , opts                                                                 = {})            {
  const seed = opts.seed ?? randomSeed();
  return {
    v: "badtown-1", code, createdAt: now, gameNo: 0, phase: "LOBBY", deadline: null, untimed: !!opts.untimed,
    day: 0, tunnel: 0, setup: null, config: { ...structuredClone(CONFIG), ...(opts.config ?? {}) }, seed, rng: seed,
    players: [], nights: [], count: null, trusty: null, outcome: null, readyNext: [], chat: [], seq: 0, seen: {},
  };
}

function addPlayer(state           , id        , rawName        , tokenHash        , isBot = false)                               {
  if (state.phase !== "LOBBY") return fail("This game has already started.");
  const name = String(rawName ?? "").replace(/\s+/g, " ").trim();
  if (name.length < 1 || name.length > 16) return fail("Names must be 1 to 16 characters.");
  if (state.players.length >= state.config.maxPlayers) return fail("This block is full.");
  if (state.players.some((p) => p.name.toLowerCase() === name.toLowerCase())) return fail("Someone here already has that name.");
  const seat = state.players.reduce((m, p) => Math.max(m, p.seat + 1), 0);
  const player         = {
    id, name, tokenHash, seat, isHost: state.players.length === 0, isBot, ready: isBot, connected: isBot,
    uniform: null, number: null, rat: false, promoted: false, allegiance: null, holeNight: null, exposed: false,
  };
  state.players.push(player);
  return { ok: true, player };
}

// ---------------------------------------------------------------------------------------
// Who is who

const playerById = (s           , id        ) => s.players.find((p) => p.id === id);

function teamOf(p        )       {
  if (p.promoted) return p.allegiance === "mole" ? "inmates" : "guards";
  if (p.uniform === "guard") return "guards";
  return p.rat ? "guards" : "inmates";
}

/** Players in the cells: inmates who haven't been promoted. */
const cellmates = (s           ) => s.players.filter((p) => p.uniform === "inmate" && !p.promoted);
/** Players in the guard room: guards plus the Trusty. */
const guardRoom = (s           ) => s.players.filter((p) => p.uniform === "guard" || p.promoted);
const inHole = (s           , p        ) => p.holeNight === s.day;
const currentNight = (s           ) => s.nights.find((n) => n.night === s.day);

function actorsFor(s           )           {
  switch (s.phase) {
    case "CELLS": return cellmates(s).filter((p) => !inHole(s, p));
    case "GUARDROOM": return guardRoom(s);
    case "COUNT": return cellmates(s);
    case "TRUSTY_PICK": return s.players.filter((p) => p.uniform === "guard");
    case "TRUSTY_CHOICE": return s.trusty?.chosen ? s.players.filter((p) => p.id === s.trusty .chosen) : [];
    default: return [];
  }
}

function hasActed(s           , id        )          {
  const n = currentNight(s);
  switch (s.phase) {
    case "CELLS": return !!n?.cells[id];
    case "GUARDROOM": return !!n?.guards[id];
    case "COUNT": return !!s.count && id in s.count.votes;
    case "TRUSTY_PICK": return !!s.trusty && id in s.trusty.votes;
    case "TRUSTY_CHOICE": return !!s.trusty?.allegiance;
    default: return s.readyNext.includes(id);
  }
}

// ---------------------------------------------------------------------------------------
// Flow

const TIMER                                                 = {
  ROLE: "role", DAY: "day", COUNT: "count", COUNT_RESULT: "morning", CELLS: "cells", GUARDROOM: "guardroom",
  MORNING: "morning", TRUSTY_PICK: "trustyPick", TRUSTY_CHOICE: "trustyChoice",
};

function setPhase(s           , phase       , now        ) {
  s.phase = phase;
  s.readyNext = [];
  const key = TIMER[phase];
  s.deadline = key && !s.untimed ? now + s.config.timers[key] * 1000 : null;
}

function startGame(s           , now        ) {
  const setup = { ...TABLES[s.players.length] }; // a copy: rooms must never share or mutate the table
  s.setup = setup;
  Object.assign(s, { day: 0, tunnel: 0, nights: [], count: null, trusty: null, outcome: null });
  const order = shuffle(s, s.players.map((p) => p.id));
  const cells = shuffle(s, Array.from({ length: setup.inmates }, (_, i) => i + 1));
  const badges = shuffle(s, Array.from({ length: setup.guards }, (_, i) => 101 + i * 7));
  order.forEach((id, i) => {
    const p = playerById(s, id) ;
    Object.assign(p, { rat: false, promoted: false, allegiance: null, holeNight: null, exposed: false });
    if (i < setup.guards) {
      p.uniform = "guard";
      p.number = badges[i];
    } else {
      p.uniform = "inmate";
      p.number = cells[i - setup.guards];
    }
  });
  const inmates = s.players.filter((p) => p.uniform === "inmate").map((p) => p.id);
  for (const id of shuffle(s, inmates).slice(0, setup.rats)) playerById(s, id) .rat = true;
  setPhase(s, "ROLE", now);
}

function startDay(s           , now        ) {
  s.day += 1;
  setPhase(s, "DAY", now);
}

function afterDay(s           , now        ) {
  if (s.config.countDay > 0 && s.day === s.config.countDay && !s.count) {
    s.count = { day: s.day, votes: {}, target: null, wasRat: null, done: false };
    return setPhase(s, "COUNT", now);
  }
  startNight(s, now);
}

function resolveCount(s           , now        ) {
  const c = s.count ;
  const tally                         = {};
  for (const t of Object.values(c.votes)) if (t) tally[t] = (tally[t] ?? 0) + 1;
  const top = Math.max(0, ...Object.values(tally));
  const leaders = Object.keys(tally).filter((id) => tally[id] === top);
  if (top > 0 && leaders.length === 1) {
    const target = playerById(s, leaders[0]) ;
    c.target = target.id;
    c.wasRat = target.rat;
    if (target.rat) target.exposed = true;
    else target.holeNight = s.day; // the wrongly accused spends tonight in the hole
  }
  c.done = true;
  setPhase(s, "COUNT_RESULT", now);
}

function startNight(s           , now        ) {
  s.nights.push({
    night: s.day, cells: {}, guards: {}, inHole: cellmates(s).filter((p) => inHole(s, p)).map((p) => p.id),
    diggers: [], caught: [], searches: {}, gain: 0, tunnelAfter: s.tunnel, resolved: false,
  });
  setPhase(s, "CELLS", now);
}

function closeCells(s           , now        ) {
  const n = currentNight(s) ;
  for (const p of actorsFor(s)) if (!n.cells[p.id]) n.cells[p.id] = { kind: "SLEEP" };
  setPhase(s, "GUARDROOM", now);
}

function resolveNight(s           , now        ) {
  const n = currentNight(s) ;
  for (const p of guardRoom(s)) if (!n.guards[p.id]) n.guards[p.id] = { kind: "SPOTLIGHT" };
  const diggers = Object.entries(n.cells).filter(([, a]) => a.kind === "DIG").map(([id]) => id);
  const searched = new Set        ();
  for (const [gid, a] of Object.entries(n.guards)) {
    if (a.kind === "SEARCH") {
      searched.add(a.target);
      n.searches[gid] = { target: a.target, found: diggers.includes(a.target) };
    }
  }
  n.diggers = diggers;
  n.caught = diggers.filter((id) => searched.has(id));
  for (const id of n.caught) playerById(s, id) .holeNight = s.day + 1;
  const tunnels = Object.values(n.guards).filter((a) => a.kind === "TUNNEL").length;
  const spots = Object.values(n.guards).filter((a) => a.kind === "SPOTLIGHT").length;
  n.gain = Math.max(0, diggers.length - n.caught.length + tunnels - spots);
  s.tunnel = Math.min(s.setup .wall, s.tunnel + n.gain);
  n.tunnelAfter = s.tunnel;
  n.resolved = true;
  setPhase(s, "MORNING", now);
}

function afterMorning(s           , now        ) {
  if (s.tunnel >= s.setup .wall) return endGame(s, "inmates", "escape");
  if (s.day >= s.config.nights) return endGame(s, "guards", "lockdown");
  if (s.day === s.config.trustyAfter && !s.trusty) {
    s.trusty = { votes: {}, chosen: null, byWarden: false, allegiance: null };
    return setPhase(s, "TRUSTY_PICK", now);
  }
  startDay(s, now);
}

function trustyCandidates(s           )           {
  return cellmates(s).filter((p) => !p.exposed);
}

function appointTrusty(s           , now        ) {
  const t = s.trusty ;
  const cands = trustyCandidates(s);
  if (cands.length === 0) {
    t.chosen = null;
    return startDay(s, now);
  }
  const tally                         = {};
  for (const id of Object.values(t.votes)) tally[id] = (tally[id] ?? 0) + 1;
  const top = Math.max(0, ...Object.values(tally));
  let chosenId        ;
  if (top === 0) {
    chosenId = pick(s, cands.map((p) => p.id).sort());
    t.byWarden = true;
  } else {
    const leaders = Object.keys(tally).filter((id) => tally[id] === top).sort();
    chosenId = leaders.length === 1 ? leaders[0] : pick(s, leaders);
    t.byWarden = leaders.length > 1;
  }
  t.chosen = chosenId;
  const p = playerById(s, chosenId) ;
  p.promoted = true;
  p.holeNight = null;
  if (p.rat) {
    p.allegiance = "rat";
    t.allegiance = "rat";
  }
  setPhase(s, "TRUSTY_CHOICE", now);
}

function closeTrustyChoice(s           , now        ) {
  const t = s.trusty ;
  if (t.chosen && !t.allegiance) {
    playerById(s, t.chosen) .allegiance = "loyal";
    t.allegiance = "loyal";
  }
  startDay(s, now);
}

function endGame(s           , winner      , reason                       ) {
  s.outcome = { winner, reason, night: s.day };
  s.phase = "END";
  s.deadline = null;
  s.readyNext = [];
}

function forceAdvance(s           , now        ) {
  switch (s.phase) {
    case "ROLE": return startDay(s, now);
    case "DAY": return afterDay(s, now);
    case "COUNT": return resolveCount(s, now);
    case "COUNT_RESULT": return startNight(s, now);
    case "CELLS": return closeCells(s, now);
    case "GUARDROOM": return resolveNight(s, now);
    case "MORNING": return afterMorning(s, now);
    case "TRUSTY_PICK": return appointTrusty(s, now);
    case "TRUSTY_CHOICE": return closeTrustyChoice(s, now);
  }
}

/** Phases where everyone just presses "ready" to move on. */
const READY_PHASES = new Set       (["ROLE", "DAY", "COUNT_RESULT", "MORNING"]);

function everyoneReady(s           )          {
  // Bots and connected humans both count; disconnected humans never hold the game up.
  const live = s.players.filter((p) => p.connected || p.isBot);
  return live.length > 0 && live.every((p) => s.readyNext.includes(p.id));
}

function maybeAdvance(s           , now        )          {
  let changed = false;
  for (let guard = 0; guard < 30; guard++) {
    let ready         ;
    if (READY_PHASES.has(s.phase)) ready = everyoneReady(s);
    else if (["CELLS", "GUARDROOM", "COUNT", "TRUSTY_PICK", "TRUSTY_CHOICE"].includes(s.phase)) {
      const actors = actorsFor(s);
      ready = actors.every((p) => hasActed(s, p.id) || (!p.connected && !p.isBot && !s.untimed));
      // In the trusty choice, a promoted Rat has nothing to choose; they just confirm.
      if (s.phase === "TRUSTY_CHOICE" && s.trusty?.allegiance === "rat") ready = actors.every((p) => s.readyNext.includes(p.id) || !p.connected);
    } else ready = false;
    if (!ready) break;
    forceAdvance(s, now);
    changed = true;
  }
  return changed;
}

function onDeadline(s           , now        )          {
  if (s.deadline === null || now < s.deadline) return false;
  forceAdvance(s, now);
  maybeAdvance(s, now);
  return true;
}

// ---------------------------------------------------------------------------------------
// Commands

function applyCommand(s           , pid        , cid                    , cmd         , now        )         {
  const p = playerById(s, pid);
  if (!p) return fail("You're not in this game.");
  if (cid) {
    const seen = (s.seen[pid] ??= []);
    if (seen.includes(cid)) return { ok: true, duplicate: true };
    seen.push(cid);
    if (seen.length > 50) seen.shift();
  }
  const res = handle(s, p, cmd, now);
  if (res.ok) maybeAdvance(s, now);
  return res;
}

function hostCanAct(s           , p        ) {
  const host = s.players.find((x) => x.isHost);
  return p.isHost || !host || (!host.connected && !host.isBot);
}

function validCellTarget(s           , actor        , id        ) {
  const t = playerById(s, id);
  return !!t && t.id !== actor.id && t.uniform === "inmate" && !t.promoted;
}

function handle(s           , p        , cmd         , now        )         {
  const n = currentNight(s);
  switch (cmd?.type) {
    case "READY":
      if (s.phase !== "LOBBY") return fail("The game has started.");
      p.ready = !!cmd.ready;
      return OK;
    case "LEAVE":
      if (s.phase !== "LOBBY") return fail("You can only leave from the lobby.");
      s.players = s.players.filter((x) => x.id !== p.id);
      if (p.isHost && s.players.length) s.players.sort((a, b) => a.seat - b.seat)[0].isHost = true;
      return OK;
    case "START": {
      if (s.phase !== "LOBBY") return fail("The game has started.");
      if (!hostCanAct(s, p)) return fail("Only the host can start.");
      const count = s.players.length;
      if (!TABLES[count]) return fail(`You need ${s.config.minPlayers} to ${s.config.maxPlayers} players.`);
      if (!s.players.every((x) => x.ready)) return fail("Everyone needs to be ready.");
      startGame(s, now);
      return OK;
    }
    case "READY_NEXT":
      if (!READY_PHASES.has(s.phase) && !(s.phase === "TRUSTY_CHOICE" && s.trusty?.allegiance === "rat")) return fail("Nothing to skip.");
      if (!s.readyNext.includes(p.id)) s.readyNext.push(p.id);
      return OK;
    case "CELL": {
      if (s.phase !== "CELLS" || !n) return fail("It's not lights out in the cells.");
      if (!actorsFor(s).some((x) => x.id === p.id)) return fail(inHole(s, p) ? "You're in the hole tonight." : "You're not in the cells.");
      if (n.cells[p.id]) return fail("You've already made your move tonight.");
      const a = cmd.act;
      if (a?.kind === "DIG" || a?.kind === "SLEEP") n.cells[p.id] = { kind: a.kind };
      else if (a?.kind === "WHISPER") {
        if (!p.rat || p.exposed) return fail("Only the Rat can whisper.");
        if (!validCellTarget(s, p, a.target)) return fail("Pick another cell.");
        n.cells[p.id] = { kind: "WHISPER", target: a.target };
      } else return fail("Pick dig or sleep.");
      return OK;
    }
    case "GUARD": {
      if (s.phase !== "GUARDROOM" || !n) return fail("It's not your watch.");
      if (!guardRoom(s).some((x) => x.id === p.id)) return fail("You're not a guard.");
      if (n.guards[p.id]) return fail("You've already made your move tonight.");
      const a = cmd.act;
      if (a?.kind === "SPOTLIGHT") n.guards[p.id] = { kind: "SPOTLIGHT" };
      else if (a?.kind === "TUNNEL") {
        if (p.allegiance !== "mole") return fail("Only the Mole can do that.");
        n.guards[p.id] = { kind: "TUNNEL" };
      } else if (a?.kind === "SEARCH") {
        const t = playerById(s, a.target);
        if (!t || !validCellTarget(s, p, t.id)) return fail("Pick a cell to search.");
        if (inHole(s, t)) return fail("That cell is empty tonight. They're in the hole.");
        n.guards[p.id] = { kind: "SEARCH", target: t.id };
      } else return fail("Pick search or spotlight.");
      return OK;
    }
    case "COUNT_VOTE":
      if (s.phase !== "COUNT" || !s.count) return fail("The vote isn't open.");
      if (!cellmates(s).some((x) => x.id === p.id)) return fail("Only the cells vote.");
      if (p.id in s.count.votes) return fail("You've already voted.");
      if (cmd.target !== null && !validCellTarget(s, p, cmd.target)) return fail("Pick another cell.");
      s.count.votes[p.id] = cmd.target;
      return OK;
    case "PICK_TRUSTY":
      if (s.phase !== "TRUSTY_PICK" || !s.trusty) return fail("The appointment isn't open.");
      if (p.uniform !== "guard") return fail("Only the guards appoint the Trusty.");
      if (p.id in s.trusty.votes) return fail("You've already chosen.");
      if (!trustyCandidates(s).some((x) => x.id === cmd.target)) return fail("Pick an inmate.");
      s.trusty.votes[p.id] = cmd.target;
      return OK;
    case "CHOOSE_SIDE":
      if (s.phase !== "TRUSTY_CHOICE" || !s.trusty) return fail("There's nothing to choose.");
      if (s.trusty.chosen !== p.id) return fail("You're not the Trusty.");
      if (s.trusty.allegiance) return fail("You've already chosen.");
      if (cmd.side !== "loyal" && cmd.side !== "mole") return fail("Pick a side.");
      p.allegiance = cmd.side;
      s.trusty.allegiance = cmd.side;
      return OK;
    case "CHAT": {
      const text = String(cmd.text ?? "").replace(/\s+/g, " ").trim().slice(0, s.config.chatMaxLength);
      if (!text) return fail("Say something.");
      s.chat.push({ pid: p.id, name: p.name, text, at: now });
      if (s.chat.length > s.config.chatHistory) s.chat.splice(0, s.chat.length - s.config.chatHistory);
      return OK;
    }
    case "REMATCH":
      if (s.phase !== "END") return fail("The game isn't over.");
      if (!hostCanAct(s, p)) return fail("Only the host can start a rematch.");
      s.gameNo += 1;
      s.seed = (s.seed * 1103515245 + 12345) | 0;
      s.rng = s.seed;
      Object.assign(s, { phase: "LOBBY", deadline: null, day: 0, tunnel: 0, setup: null, nights: [], count: null, trusty: null, outcome: null, readyNext: [], chat: [] });
      for (const x of s.players) Object.assign(x, { ready: x.isBot, uniform: null, number: null, rat: false, promoted: false, allegiance: null, holeNight: null, exposed: false });
      return OK;
    default:
      return fail("Unknown command.");
  }
}

// ---------------------------------------------------------------------------------------
// Views: the ONLY data that leaves the server. Every secret is filtered here.

function publicView(s           ) {
  const n = currentNight(s);
  const last = [...s.nights].reverse().find((x) => x.resolved);
  const showHole = ["CELLS", "GUARDROOM", "COUNT_RESULT"].includes(s.phase);
  return {
    code: s.code,
    gameNo: s.gameNo,
    phase: s.phase,
    deadline: s.deadline,
    untimed: s.untimed,
    day: s.day,
    nights: s.config.nights,
    tunnel: s.tunnel,
    wall: s.setup?.wall ?? null,
    setup: s.setup,
    countDay: s.config.countDay,
    trustyAfter: s.config.trustyAfter,
    players: s.players.slice().sort((a, b) => a.seat - b.seat).map((p) => ({
      id: p.id,
      name: p.name,
      isHost: p.isHost,
      isBot: p.isBot,
      ready: p.ready,
      connected: p.connected,
      uniform: p.uniform,
      number: p.number,
      promoted: p.promoted,
      exposed: p.exposed,
      inHole: showHole && inHole(s, p),
      acted: actorsFor(s).some((a) => a.id === p.id) ? hasActed(s, p.id) : null,
      movedOn: s.readyNext.includes(p.id),
    })),
    morning: last && s.phase === "MORNING" ? { night: last.night, gain: last.gain, tunnel: last.tunnelAfter, caught: last.caught } : null,
    history: s.nights.filter((x) => x.resolved).map((x) => ({ night: x.night, gain: x.gain, tunnel: x.tunnelAfter, caught: x.caught })),
    count: s.count ? { day: s.count.day, votesIn: Object.keys(s.count.votes).length, done: s.count.done, target: s.count.done ? s.count.target : null, wasRat: s.count.done ? s.count.wasRat : null } : null,
    trusty: s.trusty ? { chosen: s.trusty.chosen, byWarden: s.trusty.byWarden, picksIn: Object.keys(s.trusty.votes).length } : null,
    chat: s.chat,
    outcome: s.phase === "END" ? s.outcome : null,
  };
}

function privateView(s           , pid        ) {
  const p = playerById(s, pid);
  if (!p) return null;
  const n = currentNight(s);
  const inGuardRoom = p.uniform === "guard" || p.promoted;
  const actors = actorsFor(s);
  return {
    id: p.id,
    name: p.name,
    isHost: p.isHost,
    uniform: p.uniform,
    number: p.number,
    rat: p.rat,
    exposed: p.exposed,
    promoted: p.promoted,
    allegiance: p.allegiance,
    team: p.uniform ? teamOf(p) : null,
    inHole: inHole(s, p) && ["CELLS", "GUARDROOM", "COUNT_RESULT"].includes(s.phase),
    mustAct: actors.some((a) => a.id === p.id) && !hasActed(s, p.id),
    cellAct: n?.cells[p.id] ?? null,
    guardAct: n?.guards[p.id] ?? null,
    // Guard room only: tonight's whispers from the cells, and your own search results.
    whispers: inGuardRoom && n && s.phase === "GUARDROOM"
      ? Object.values(n.cells).filter((a) => a.kind === "WHISPER").map((a) => (a                      ).target)
      : [],
    searches: inGuardRoom ? s.nights.filter((x) => x.resolved && x.searches[p.id]).map((x) => ({ night: x.night, ...x.searches[p.id] })) : [],
    countVote: s.count && p.id in s.count.votes ? s.count.votes[p.id] : undefined,
    trustyVote: s.trusty?.votes[p.id],
  };
}

/** Everything, laid bare. Only once the game is over. */
function finalReveal(s           ) {
  return {
    outcome: s.outcome,
    tunnel: s.tunnel,
    wall: s.setup?.wall,
    players: s.players.map((p) => ({
      id: p.id, name: p.name, uniform: p.uniform, number: p.number, rat: p.rat, promoted: p.promoted,
      allegiance: p.allegiance, exposed: p.exposed, team: teamOf(p), won: s.outcome ? teamOf(p) === s.outcome.winner : false,
    })),
    nights: s.nights.map((x) => ({ night: x.night, cells: x.cells, guards: x.guards, inHole: x.inHole, caught: x.caught, gain: x.gain, tunnel: x.tunnelAfter })),
    count: s.count,
    trusty: s.trusty,
  };
}

function viewFor(s           , pid        ) {
  return { pub: publicView(s), me: privateView(s, pid), reveal: s.phase === "END" ? finalReveal(s) : null };
}

// ---- src/badtown/bots.ts
// Practice-mode opponents. Each bot only uses what its player could know, with one deliberate
// exception: the Rat bot sometimes "overhears" a real digger, standing in for the table talk a
// human Rat would be listening to.


/** Bot temperament. Calibrated so bot-only games land near 50/50 (see test/badtown.test.ts). */
const BOT = {
  dig: 0.92,
  digAfterHole: 0.8,
  ratDig: 0.25,
  ratOverhear: 0.5,
  followWhisper: 0.65,
  search: 0.5,
  moleTunnel: 0.75,
  becomeMole: 0.7,
};
const choice =    (r      , xs     ) => xs[Math.floor(r() * xs.length)];
function weighted   (r      , xs     , w          )    {
  const total = w.reduce((a, b) => a + b, 0);
  let x = r() * total;
  for (let i = 0; i < xs.length; i++) if ((x -= w[i]) <= 0) return xs[i];
  return xs[xs.length - 1];
}

const timesCaught = (s           , id        ) => s.nights.filter((n) => n.caught.includes(id)).length;
const cellName = (p        ) => `cell ${p.number}`;

/** How Rat-like an inmate looks from the outside: never caught, never in trouble. */
function ratLook(s           , p        ) {
  if (p.exposed) return 0.05;
  const caught = timesCaught(s, p.id);
  const wronglyVoted = s.count?.target === p.id && s.count.wasRat === false;
  return wronglyVoted ? 0.2 : caught === 0 ? 2 : 0.4 / caught;
}

function botMove(s           , id        , r      )                 {
  const me = playerById(s, id);
  if (!me) return null;
  const n = currentNight(s);
  switch (s.phase) {
    case "LOBBY":
      return me.ready ? null : { type: "READY", ready: true };
    case "ROLE":
    case "DAY":
    case "COUNT_RESULT":
    case "MORNING":
      return s.readyNext.includes(id) ? null : { type: "READY_NEXT" };
    case "CELLS": {
      if (!actorsFor(s).some((p) => p.id === id) || hasActed(s, id)) return null;
      const others = cellmates(s).filter((p) => p.id !== id && !inHole(s, p));
      if (me.rat && !me.exposed) {
        if (r() < BOT.ratDig || others.length === 0) return { type: "CELL", act: { kind: "DIG" } };
        const diggers = others.filter((p) => n?.cells[p.id]?.kind === "DIG");
        const t = diggers.length && r() < BOT.ratOverhear ? choice(r, diggers) : choice(r, others);
        return { type: "CELL", act: { kind: "WHISPER", target: t.id } };
      }
      if (me.rat) return { type: "CELL", act: { kind: r() < 0.2 ? "DIG" : "SLEEP" } };
      const justOut = s.nights.some((x) => x.night === s.day - 1 && x.caught.includes(id));
      return { type: "CELL", act: { kind: r() < (justOut ? BOT.digAfterHole : BOT.dig) ? "DIG" : "SLEEP" } };
    }
    case "GUARDROOM": {
      if (!n || hasActed(s, id)) return null;
      if (me.allegiance === "mole") return { type: "GUARD", act: r() < BOT.moleTunnel ? { kind: "TUNNEL" } : { kind: "SPOTLIGHT" } };
      const taken = new Set(Object.values(n.guards).flatMap((a) => (a.kind === "SEARCH" ? [a.target] : [])));
      const pool = cellmates(s).filter((p) => !inHole(s, p) && !taken.has(p.id) && p.id !== id);
      const whispered = Object.values(n.cells).flatMap((a) => (a.kind === "WHISPER" ? [a.target] : [])).filter((t) => pool.some((p) => p.id === t));
      if (whispered.length && r() < BOT.followWhisper) return { type: "GUARD", act: { kind: "SEARCH", target: choice(r, whispered) } };
      if (pool.length && r() < BOT.search) {
        const t = weighted(r, pool, pool.map((p) => 0.6 + timesCaught(s, p.id) * 0.8 + (p.exposed ? -0.5 : 0)));
        return { type: "GUARD", act: { kind: "SEARCH", target: t.id } };
      }
      return { type: "GUARD", act: { kind: "SPOTLIGHT" } };
    }
    case "COUNT": {
      if (!cellmates(s).some((p) => p.id === id) || hasActed(s, id)) return null;
      const others = cellmates(s).filter((p) => p.id !== id);
      if (!others.length || r() < 0.1) return { type: "COUNT_VOTE", target: null };
      if (me.rat) {
        const honest = others.filter((p) => !p.rat);
        return { type: "COUNT_VOTE", target: choice(r, honest.length ? honest : others).id };
      }
      return { type: "COUNT_VOTE", target: weighted(r, others, others.map((p) => ratLook(s, p))).id };
    }
    case "TRUSTY_PICK": {
      if (me.uniform !== "guard" || hasActed(s, id)) return null;
      const cands = trustyCandidates(s);
      if (!cands.length) return null;
      return { type: "PICK_TRUSTY", target: weighted(r, cands, cands.map((p) => ratLook(s, p))).id };
    }
    case "TRUSTY_CHOICE": {
      if (s.trusty?.chosen !== id) return null;
      if (s.trusty.allegiance === "rat") return s.readyNext.includes(id) ? null : { type: "READY_NEXT" };
      if (s.trusty.allegiance) return null;
      return { type: "CHOOSE_SIDE", side: r() < BOT.becomeMole ? "mole" : "loyal" };
    }
    default:
      return null;
  }
}

/** One line of yard talk for the day phase, or nothing. Bots lie when it suits them. */
function botChatter(s           , id        , r      )                {
  const me = playerById(s, id);
  if (!me || s.phase !== "DAY" || r() < 0.35) return null;
  const last = [...s.nights].reverse().find((x) => x.resolved);
  const cells = cellmates(s).filter((p) => p.id !== id);
  const someone = cells.length ? choice(r, cells) : null;
  const lines           = [];
  if (me.uniform === "inmate" && !me.promoted) {
    const dug = last?.cells[id]?.kind === "DIG";
    if (last?.caught.includes(id)) lines.push("Fine, you caught me. Doesn't make me the Rat.", "One night in the hole. Worth it.");
    else if (me.rat) lines.push("Dug all night. My hands are wrecked.", someone ? `${cellName(someone)} is very quiet for someone who says they're digging.` : "Keep digging, lads.", "Somebody in here is talking to the guards. Not me.");
    else if (dug) lines.push("Did my bit last night.", "Another metre from me.", someone ? `Anyone else notice the guards never search ${cellName(someone)}?` : "Keep going.");
    else lines.push("I slept. Someone has to look innocent.", "Laid low last night. They were watching me.");
    if (s.day === s.config.countDay && someone) lines.push(`I'm voting ${cellName(someone)} at the count.`);
  } else if (me.allegiance === "mole") {
    lines.push(someone ? `I searched ${cellName(someone)}. Clean.` : "Quiet night.", "Nothing to report from the guard room.", "I'm one of you lot now. Sort of.");
  } else {
    if (last && last.gain >= 2) lines.push(`${last.gain} metres in one night? Someone's being generous with the truth.`);
    lines.push(someone ? `${cellName(someone)}, we're watching you.` : "We're watching.", "The spotlight doesn't lie.", "Whoever's digging: we know.");
    if (s.day === s.config.trustyAfter) lines.push("Big decision coming. Choose your Trusty carefully.");
  }
  return choice(r, lines);
}

return { newRoom, addPlayer, applyCommand, viewFor, botMove, botChatter, playerById, TABLES, CONFIG };
})();
</script>
<script>
// BADTOWN practice yard: you against bots, running the real engine in the browser.
// BT (the engine and bots) is bundled in above this script by scripts/build-practice.mjs.

const { newRoom, addPlayer, applyCommand, viewFor, botMove, botChatter, playerById, TABLES } = BT;
const HUMAN = "you";
const BOT_NAMES = ["Mouse", "Dutch", "Biscuit", "Preacher", "Sully", "Kit", "Moss", "Rook", "Vinnie"];
const app = document.getElementById("app");
const strip = document.getElementById("strip");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

let opts = { name: "", size: 6, role: "random" };
try { Object.assign(opts, JSON.parse(localStorage.getItem("badtown-practice") || "{}")); } catch {}
let state = null;
let pumpTimer = null;
let chatted = new Set();
let lastPhaseKey = "";
let shownTunnel = 0;
let cid = 0;
let dayStart = 0;

// ---------------------------------------------------------------------------------------
// Game control

function startGame() {
  try { localStorage.setItem("badtown-practice", JSON.stringify(opts)); } catch {}
  const now = Date.now();
  state = newRoom("YARD01", now, { untimed: true });
  addPlayer(state, HUMAN, opts.name.trim() || "You", "").player.connected = true;
  const names = BOT_NAMES.slice().sort(() => Math.random() - 0.5);
  for (let i = 1; i < opts.size; i++) addPlayer(state, `b${i}`, names[i - 1], "", true);
  applyCommand(state, HUMAN, undefined, { type: "READY", ready: true }, now);
  applyCommand(state, HUMAN, undefined, { type: "START" }, now);
  forceRole();
  chatted = new Set();
  shownTunnel = 0;
  render();
  pump();
}

/** Practice lets you choose your side: swap seats with someone who has the role you want. */
function forceRole() {
  const me = playerById(state, HUMAN);
  const want = opts.role === "random" ? null : opts.role;
  let other = null;
  if (want === "guard" && me.uniform !== "guard") other = state.players.find((p) => p.uniform === "guard");
  if (want === "inmate" && (me.uniform !== "inmate" || me.rat)) other = state.players.find((p) => p.uniform === "inmate" && !p.rat && p.id !== HUMAN);
  if (want === "rat" && !me.rat) other = state.players.find((p) => p.rat);
  if (!other) return;
  for (const k of ["uniform", "number", "rat"]) [me[k], other[k]] = [other[k], me[k]];
}

function act(cmd) {
  const res = applyCommand(state, HUMAN, `h${++cid}`, cmd, Date.now());
  if (!res.ok) toast(res.error);
  render();
  pump();
}

/** Bots act one at a time with a short pause, so the night feels like it's happening. */
function pump() {
  clearTimeout(pumpTimer);
  if (!state || state.phase === "END") return;
  if (state.phase === "DAY") scheduleChatter();
  const bots = state.players.filter((p) => p.isBot && botMove(state, p.id, Math.random));
  if (!bots.length) return;
  const quick = ["ROLE", "DAY", "MORNING", "COUNT_RESULT"].includes(state.phase);
  pumpTimer = setTimeout(() => {
    const bot = bots[Math.floor(Math.random() * bots.length)];
    const move = botMove(state, bot.id, Math.random);
    if (move) applyCommand(state, bot.id, undefined, move, Date.now());
    render();
    pump();
  }, quick ? 120 : 380 + Math.random() * 520);
}

function scheduleChatter() {
  state.players.filter((p) => p.isBot).forEach((p, i) => {
    const key = `${state.gameNo}:${state.day}:${p.id}`;
    if (chatted.has(key)) return;
    chatted.add(key);
    setTimeout(() => {
      if (state.phase !== "DAY") return;
      const line = botChatter(state, p.id, Math.random);
      if (line) {
        applyCommand(state, p.id, undefined, { type: "CHAT", text: line }, Date.now());
        render();
      }
    }, 500 + i * 700 + Math.random() * 400);
  });
}

// ---------------------------------------------------------------------------------------
// Bits

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (t.hidden = true), 2600);
}

const P = (id) => state.players.find((p) => p.id === id);
function label(id) {
  const p = P(id);
  if (!p) return "?";
  if (p.uniform === "guard") return `Badge ${p.number}`;
  return `Cell ${p.number}`;
}
const who = (id) => `${label(id)}${id === HUMAN ? " (you)" : ` (${esc(P(id).name)})`}`;
const btn = (text, cmd, cls = "") => `<button class="btn ${cls}" data-cmd='${esc(JSON.stringify(cmd))}'>${text}</button>`;

function roleLine(me) {
  if (me.uniform === "guard") return { title: "Guard", secret: "" };
  if (me.promoted) return { title: `Trusty, cell ${me.number}`, secret: me.allegiance === "mole" ? "Mole" : me.allegiance === "rat" ? "Rat" : "Loyal" };
  return { title: `Cell ${me.number}`, secret: me.rat ? (me.exposed ? "Rat, exposed" : "Rat") : "" };
}

// ---------------------------------------------------------------------------------------
// Render

function render() {
  if (!state) return setupScreen();
  const v = viewFor(state, HUMAN);
  const { pub, me } = v;
  document.body.dataset.lights = ["CELLS", "GUARDROOM"].includes(pub.phase) ? "off" : "on";
  renderStrip(pub, me);
  const screens = { ROLE: roleScreen, DAY: dayScreen, COUNT: countScreen, COUNT_RESULT: countResult, CELLS: cellsScreen, GUARDROOM: guardScreen, MORNING: morningScreen, TRUSTY_PICK: trustyPick, TRUSTY_CHOICE: trustyChoice, END: endScreen };
  const key = `${pub.gameNo}:${pub.day}:${pub.phase}`;
  const fresh = key !== lastPhaseKey;
  lastPhaseKey = key;
  if (fresh && pub.phase === "DAY") dayStart = Date.now() - 1; // yard talk shows only today's chatter
  app.innerHTML = screens[pub.phase](v) + roster(pub);
  app.querySelectorAll("[data-cmd]").forEach((b) => (b.onclick = () => act(JSON.parse(b.dataset.cmd))));
  app.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => (b.dataset.go === "again" ? startGame() : ((state = null), render()))));
  if (fresh) {
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    app.querySelectorAll(".stamp").forEach((s) => s.classList.add("land"));
  }
}

function renderStrip(pub, me) {
  strip.hidden = false;
  const r = roleLine(me);
  const wall = pub.wall ?? 0;
  const blocks = Array.from({ length: wall }, (_, i) => `<i class="${i < pub.tunnel ? "dug" : ""}${i >= shownTunnel && i < pub.tunnel ? " new" : ""}"></i>`).join("");
  shownTunnel = pub.tunnel;
  strip.innerHTML = `<div class="wrap" style="display:grid;gap:8px">
    <div class="top"><span class="day">${pub.phase === "ROLE" ? "Booking in" : pub.phase === "END" ? "Day " + pub.day : `Day ${pub.day} of ${pub.nights}`}</span>
      <span class="me">${esc(r.title)}${r.secret ? ` · <span class="secret">${esc(r.secret)}</span>` : ""}</span></div>
    <div class="tunnel" role="img" aria-label="Tunnel ${pub.tunnel} of ${wall} metres"><span class="end">Cells</span>
      <div class="blocks" style="grid-template-columns:repeat(${wall},1fr)">${blocks}</div>
      <span class="row" style="gap:6px"><span class="end">${pub.tunnel}/${wall} m</span><span class="wall"></span></span></div>
  </div>`;
}

function roster(pub) {
  const tags = (p) => [p.promoted ? "Trusty" : "", p.exposed ? "Rat" : "", p.inHole ? "In the hole" : ""].filter(Boolean).join(" · ");
  const cards = pub.players.slice().sort((a, b) => (a.uniform === b.uniform ? a.number - b.number : a.uniform === "guard" ? -1 : 1)).map((p) => {
    const cls = p.uniform === "guard" || p.promoted ? "guard" : "inmate";
    const num = p.uniform === "guard" ? `Badge ${p.number}` : `Cell ${p.number}`;
    return `<div class="${cls}${p.id === HUMAN ? " you" : ""}"><span class="num">${num}</span><span class="nm">${p.id === HUMAN ? "You" : esc(p.name)}</span>${tags(p) ? `<span class="tag">${tags(p)}</span>` : ""}</div>`;
  }).join("");
  return `<section class="stack" aria-label="The block"><hr><p class="label">The block</p><div class="roster">${cards}</div></section>`;
}

// ---------------------------------------------------------------------------------------
// Screens

function setupScreen() {
  document.body.dataset.lights = "on";
  strip.hidden = true;
  const t = TABLES[opts.size];
  const sizes = [4, 5, 6, 7, 8].map((n) => `<button data-size="${n}" aria-pressed="${opts.size === n}">${n}</button>`).join("");
  const roles = [["random", "Random"], ["inmate", "Inmate"], ["rat", "Rat"], ["guard", "Guard"]].map(([k, l]) => `<button data-role="${k}" aria-pressed="${opts.role === k}">${l}</button>`).join("");
  app.innerHTML = `
    <section class="hero">
      <div class="title">Bad<br>town</div>
      <p class="sub">There's a tunnel under Badtown. There's a Rat in the cells. And by night four, there's a Mole in the uniform.</p>
      <p class="muted">Practice yard: you against the bots. Same rules as the real game.</p>
    </section>
    <section class="sheet">
      <p class="label">Booking form</p>
      <label class="stack" style="gap:6px"><span class="label">Your name</span><input type="text" id="name" maxlength="16" value="${esc(opts.name)}" placeholder="You"></label>
      <div class="stack" style="gap:6px"><span class="label">Players at the table</span><div class="seg" role="group" aria-label="Players">${sizes}</div>
        <p class="small muted">${t.guards} guard${t.guards > 1 ? "s" : ""}, ${t.inmates} inmates, ${t.rats} Rat${t.rats > 1 ? "s" : ""} among them. The wall is ${t.wall} metres away.</p></div>
      <div class="stack" style="gap:6px"><span class="label">Play as</span><div class="seg" role="group" aria-label="Role">${roles}</div></div>
      <button class="btn hot wide" id="go">Lock me up</button>
    </section>
    <details class="rules sheet"><summary>How it works</summary>
      <ol>
        <li><b>Day.</b> Talk. Accuse. Lie.</li>
        <li><b>Lights out in the cells.</b> Each inmate secretly digs or sleeps. The Rat can whisper a cell number to the guards instead.</li>
        <li><b>Lights out in the guard room.</b> Each guard searches a cell or sweeps the yard with the spotlight. A search catches a digger in the act: no metre, and a night in the hole. The spotlight knocks a metre off tonight's dig.</li>
        <li><b>Morning.</b> Everyone sees how far the tunnel grew, and who got caught.</li>
        <li><b>Day 3:</b> the cells vote on who the Rat is. Get it right and the Rat is finished. Get it wrong and an innocent spends the night in the hole.</li>
        <li><b>After night 3:</b> the guards must make one inmate a Trusty. Pick the Rat and you gain a loyal officer. Pick anyone else and they choose: stay Loyal, or become the Mole and dig from inside the uniform.</li>
        <li>Reach the wall by dawn on day 6 and the inmates escape. Otherwise, lockdown.</li>
      </ol></details>`;
  app.querySelectorAll("[data-size]").forEach((b) => (b.onclick = () => { opts.size = +b.dataset.size; opts.name = document.getElementById("name").value; setupScreen(); }));
  app.querySelectorAll("[data-role]").forEach((b) => (b.onclick = () => { opts.role = b.dataset.role; opts.name = document.getElementById("name").value; setupScreen(); }));
  document.getElementById("go").onclick = () => { opts.name = document.getElementById("name").value; startGame(); };
}

function roleScreen({ pub, me }) {
  const t = pub.setup;
  let objective;
  if (me.uniform === "guard") objective = "Stop the tunnel reaching the wall by dawn on day 6. Search cells, sweep the yard. After night 3 you must make one inmate your Trusty. Try to pick the Rat.";
  else if (me.rat) objective = "You work for the guards. Each night you can whisper a cell number to them. If the tunnel fails, you win. If they make you Trusty, you're in. Don't get caught out at the day 3 vote.";
  else objective = "Dig. Reach the wall by dawn on day 6 and you're out. One of your cellmates is a Rat. On day 3 the cells vote on who.";
  return `<main><section class="stack">
    <h2>${me.uniform === "guard" ? "You're a guard" : me.rat ? "You're the Rat" : "You're an inmate"}</h2>
    <div class="sheet"><dl>
      <dt>Name</dt><dd>${esc(me.name)}</dd>
      <dt>${me.uniform === "guard" ? "Badge" : "Cell"}</dt><dd>${me.number}</dd>
      <dt>Wins with</dt><dd>${me.uniform === "guard" || me.rat ? "The guards" : "The inmates"}</dd>
      <dt>Secret</dt><dd>${me.rat ? "<b>You're the Rat.</b> Nobody knows." : "None. Yet."}</dd>
    </dl><p>${objective}</p></div>
    <p class="muted small">This block: ${t.guards} guard${t.guards > 1 ? "s" : ""}, ${t.inmates} inmates, ${t.rats} Rat${t.rats > 1 ? "s" : ""}. The wall is ${t.wall} metres from the cells.</p>
    ${btn("Start day 1", { type: "READY_NEXT" }, "hot wide")}
  </section></main>`;
}

function lastNightLine(pub) {
  const h = pub.history[pub.history.length - 1];
  if (!h) return "";
  return `<p class="note">Last night the tunnel grew <b>${h.gain} m</b>${h.caught.length ? `. Caught: ${h.caught.map(label).join(", ")}` : ""}.</p>`;
}

function dayScreen({ pub, me }) {
  const lines = state.chat.filter((c) => c.at >= dayStart).slice(-10);
  const notes = [];
  if (pub.day === pub.countDay) notes.push(`<p class="note">Before lights out tonight, the cells vote on who the Rat is.</p>`);
  if (pub.trusty?.chosen && pub.day === pub.trustyAfter + 1) notes.push(`<p class="note">${who(pub.trusty.chosen)} wears a Trusty badge now. Whose side are they on?</p>`);
  if (me.uniform === "guard" && pub.day === pub.trustyAfter) notes.push(`<p class="note">After tonight you must appoint a Trusty.</p>`);
  return `<main><section class="stack">
    <h2>Day ${pub.day}</h2>
    ${lastNightLine(pub)}
    ${notes.join("")}
    <p class="label">Yard talk</p>
    ${lines.length ? `<ul class="yard">${lines.map((c) => `<li><b>${esc(label(c.pid))}</b><span>${esc(c.text)}</span></li>`).join("")}</ul>` : `<p class="muted">Quiet in the yard.</p>`}
    ${btn(pub.day === pub.countDay ? "Call the vote" : "Lights out", { type: "READY_NEXT" }, "hot wide")}
  </section></main>`;
}

function countScreen({ pub, me }) {
  const voter = me.uniform === "inmate" && !me.promoted;
  if (!voter) return `<main><section class="stack"><h2>The count</h2><p>The cells are voting on who the Rat is. You can only watch.</p></section></main>`;
  if (me.countVote !== undefined) return `<main><section class="stack"><h2>The count</h2><p>Vote cast. Waiting for the rest of the cells.</p></section></main>`;
  const others = pub.players.filter((p) => p.uniform === "inmate" && !p.promoted && p.id !== HUMAN);
  return `<main><section class="stack">
    <h2>Who's the Rat?</h2>
    <p>Most votes wins. Get it right and the Rat can't whisper again. Get it wrong and that cell spends tonight in the hole.${me.rat ? " <b>You're the Rat.</b> Steer it somewhere else." : ""}</p>
    <div class="cells">${others.map((p) => btn(`Cell ${p.number}<small>${esc(p.name)}</small>`, { type: "COUNT_VOTE", target: p.id })).join("")}${btn("Nobody", { type: "COUNT_VOTE", target: null }, "ghost")}</div>
  </section></main>`;
}

function countResult({ pub }) {
  const c = pub.count;
  let body;
  if (!c.target) body = `<div class="stamp olive">No verdict</div><p>The votes were split. Nobody's named.</p>`;
  else if (c.wasRat) body = `<div class="stamp">Rat</div><p>${who(c.target)} was the Rat. No more whispers from them.</p>`;
  else body = `<div class="stamp olive">Innocent</div><p>${who(c.target)} wasn't the Rat. They spend tonight in the hole anyway.</p>`;
  return `<main><section class="stack"><h2>The count</h2>${body}${btn("Lights out", { type: "READY_NEXT" }, "hot wide")}</section></main>`;
}

function cellsScreen({ pub, me }) {
  if (me.mustAct) {
    const others = pub.players.filter((p) => p.uniform === "inmate" && !p.promoted && p.id !== HUMAN);
    return `<main><section class="stack">
      <h2>Lights out</h2>
      <div class="big">${btn(`Dig<small>+1 m, unless they search you</small>`, { type: "CELL", act: { kind: "DIG" } }, "hot")}${btn(`Sleep<small>Stay clean tonight</small>`, { type: "CELL", act: { kind: "SLEEP" } }, "ghost")}</div>
      ${me.rat && !me.exposed ? `<p class="label">Or whisper to the guards</p><div class="cells">${others.map((p) => btn(`Cell ${p.number}<small>${esc(p.name)}</small>`, { type: "CELL", act: { kind: "WHISPER", target: p.id } }, "ghost")).join("")}</div>` : ""}
    </section></main>`;
  }
  if (me.cellAct) return `<main><section class="stack"><h2>Lights out</h2><p>${me.cellAct.kind === "DIG" ? "You're digging." : me.cellAct.kind === "WHISPER" ? `You whispered ${label(me.cellAct.target)}.` : "You're asleep. Or pretending."} Waiting for the rest of the cells.</p></section></main>`;
  if (me.inHole) return `<main><section class="stack"><h2>The hole</h2><p>No digging for you tonight.</p></section></main>`;
  return `<main><section class="stack"><h2>Lights out</h2><p class="muted">Something's scraping down in the cells.</p></section></main>`;
}

function guardScreen({ pub, me }) {
  const inRoom = me.uniform === "guard" || me.promoted;
  if (!inRoom) return `<main><section class="stack"><h2>Lights out</h2><p class="muted">Footsteps in the corridor. The guards are choosing.</p></section></main>`;
  if (!me.mustAct) return `<main><section class="stack"><h2>The guard room</h2><p>Order given. Waiting for the others.</p></section></main>`;
  const targets = pub.players.filter((p) => p.uniform === "inmate" && !p.promoted && !p.inHole && p.id !== HUMAN);
  return `<main><section class="stack">
    <h2>The guard room</h2>
    ${me.whispers.length ? me.whispers.map((t) => `<p class="note">A whisper from the cells: <b>${label(t)}</b>.</p>`).join("") : `<p class="muted">No whispers tonight.</p>`}
    <p class="label">Search a cell</p>
    <div class="cells">${targets.map((p) => btn(`Cell ${p.number}<small>${esc(p.name)}</small>`, { type: "GUARD", act: { kind: "SEARCH", target: p.id } }, "ghost")).join("")}</div>
    <p class="label">Or</p>
    <div class="big">${btn(`Spotlight<small>Knock a metre off tonight</small>`, { type: "GUARD", act: { kind: "SPOTLIGHT" } }, "ghost")}${me.allegiance === "mole" ? btn(`Tunnel<small>+1 m from inside. Nobody sees.</small>`, { type: "GUARD", act: { kind: "TUNNEL" } }, "hot") : ""}</div>
  </section></main>`;
}

function morningScreen({ pub, me }) {
  const m = pub.morning;
  const through = pub.tunnel >= pub.wall;
  const last = pub.day >= pub.nights;
  const mine = me.searches.find((s) => s.night === m.night);
  const left = pub.wall - pub.tunnel;
  return `<main><section class="stack">
    <h2>Morning, day ${m.night}</h2>
    <div class="stamp ${through ? "go" : "olive"}">${through ? "Through" : `+${m.gain} m`}</div>
    <p>${through ? "The tunnel has reached the wall." : `The tunnel grew <b>${m.gain} metre${m.gain === 1 ? "" : "s"}</b>. ${left} to go.`}</p>
    ${m.caught.map((id) => `<p class="note alarm"><b>Caught digging:</b> ${who(id)}. In the hole tonight.</p>`).join("")}
    ${mine ? `<p class="note">Your search of ${label(mine.target)}: <b>${mine.found ? "caught them digging" : "clean"}</b>. Only you know.</p>` : ""}
    ${!through && last ? `<p class="note alarm">Dawn on day ${pub.nights}. The tunnel came up short.</p>` : ""}
    ${btn(through || last ? "See who walked out" : pub.day === pub.trustyAfter ? "Appoint the Trusty" : "Next day", { type: "READY_NEXT" }, "hot wide")}
  </section></main>`;
}

function trustyPick({ pub, me }) {
  if (me.uniform !== "guard") return `<main><section class="stack"><h2>A badge on the table</h2><p>The guards are choosing a Trusty from the cells.</p></section></main>`;
  if (me.trustyVote) return `<main><section class="stack"><h2>A badge on the table</h2><p>You chose ${label(me.trustyVote)}. Waiting for the other guards.</p></section></main>`;
  const cands = pub.players.filter((p) => p.uniform === "inmate" && !p.promoted && !p.exposed);
  return `<main><section class="stack">
    <h2>Appoint a Trusty</h2>
    <p>Pick the Rat and you gain a loyal officer. Pick anyone else and they might stay loyal, or become the Mole.</p>
    <div class="cells">${cands.map((p) => btn(`Cell ${p.number}<small>${esc(p.name)}</small>`, { type: "PICK_TRUSTY", target: p.id })).join("")}</div>
  </section></main>`;
}

function trustyChoice({ pub, me }) {
  const chosen = pub.trusty.chosen;
  if (chosen !== HUMAN) return `<main><section class="stack"><h2>A badge on the table</h2><p>${who(chosen)} is the new Trusty${pub.trusty.byWarden ? ". The guards couldn't agree, so the warden picked." : "."} They're choosing a side.</p></section></main>`;
  if (me.allegiance === "rat") return `<main><section class="stack"><h2>They picked you</h2><div class="stamp">In</div><p>You're the Rat, and now you've got a badge. You join the guard room. Nobody in the cells needs to know.</p>${btn("Into the guard room", { type: "READY_NEXT" }, "hot wide")}</section></main>`;
  if (me.allegiance) return `<main><section class="stack"><h2>Sworn in</h2><p>Waiting for day ${pub.day + 1}.</p></section></main>`;
  return `<main><section class="stack">
    <h2>They gave you a badge</h2>
    <p>You're the Trusty. You work in the guard room now. Decide, in secret, who you really work for.</p>
    <div class="big">${btn(`Loyal<small>Switch sides. Win with the guards.</small>`, { type: "CHOOSE_SIDE", side: "loyal" }, "ghost")}${btn(`Mole<small>Stay with the cells. Dig from inside.</small>`, { type: "CHOOSE_SIDE", side: "mole" }, "hot")}</div>
  </section></main>`;
}

function endScreen({ pub, reveal }) {
  const r = reveal;
  const meR = r.players.find((p) => p.id === HUMAN);
  const escaped = r.outcome.winner === "inmates";
  const name = (id) => label(id) + (id === HUMAN ? " (you)" : "");
  const roleOf = (p) => p.promoted ? (p.allegiance === "mole" ? "Trusty, the Mole" : p.allegiance === "rat" ? "Trusty, the Rat" : "Trusty, loyal") : p.uniform === "guard" ? "Guard" : p.rat ? "The Rat" : "Inmate";
  const order = r.players.slice().sort((a, b) => (a.uniform === b.uniform ? a.number - b.number : a.uniform === "guard" ? 1 : -1));
  const cell = (n, id) => {
    const c = n.cells[id];
    const g = n.guards[id];
    if (n.inHole.includes(id)) return `<td class="hole">Hole</td>`;
    if (c) {
      const caught = n.caught.includes(id);
      if (c.kind === "DIG") return `<td class="${caught ? "caught" : "dig"}">${caught ? "Caught" : "Dug"}</td>`;
      if (c.kind === "WHISPER") return `<td>Whisper ${esc(label(c.target).replace("Cell ", "c"))}</td>`;
      return `<td>Slept</td>`;
    }
    if (g) return `<td${g.kind === "TUNNEL" ? ' class="dig"' : ""}>${g.kind === "SEARCH" ? `Search ${esc(label(g.target).replace("Cell ", "c"))}` : g.kind === "TUNNEL" ? "Tunnel" : "Spotlight"}</td>`;
    return `<td class="muted">–</td>`;
  };
  return `<main><section class="stack">
    <div class="stamp ${escaped ? "go" : ""}">${escaped ? "Escape" : "Lockdown"}</div>
    <h2>${meR.won ? "You win" : "You lose"}</h2>
    <p>${escaped ? `The inmates reached the wall on night ${r.outcome.night}.` : `Dawn on day ${r.outcome.night}. The tunnel stopped ${r.wall - r.tunnel} metre${r.wall - r.tunnel === 1 ? "" : "s"} short.`}</p>
    <p class="label">Who was who</p>
    <div class="sheet"><dl>${order.map((p) => `<dt>${esc(name(p.id))}</dt><dd>${esc(p.id === HUMAN ? "You" : p.name)}: <b>${roleOf(p)}</b>${p.exposed ? " (outed at the count)" : ""}${p.won ? " · won" : ""}</dd>`).join("")}</dl></div>
    <p class="label">Night by night</p>
    <div class="scroll"><table><thead><tr><th></th>${r.nights.map((n) => `<th>N${n.night}</th>`).join("")}</tr></thead><tbody>
      ${order.map((p) => `<tr><th>${esc(name(p.id))}</th>${r.nights.map((n) => cell(n, p.id)).join("")}</tr>`).join("")}
      <tr><th>Tunnel</th>${r.nights.map((n) => `<td>+${n.gain} → ${n.tunnel}</td>`).join("")}</tr>
    </tbody></table></div>
    ${r.count?.done ? `<p class="note">The count on day ${r.count.day}: ${r.count.target ? `${esc(name(r.count.target))} named, ${r.count.wasRat ? "and they were the Rat" : "and they were innocent"}` : "no verdict"}.</p>` : ""}
    <div class="row"><button class="btn hot" data-go="again">Play again</button><button class="btn ghost" data-go="setup">Change setup</button></div>
  </section></main>`;
}

render();

</script>
